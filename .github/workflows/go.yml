name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  build:
    name: ${{matrix.go-version}} ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Generate
      run: go generate ./cmd/...

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Vet (v2)
      working-directory: v2
      run: go vet ./...

    - name: Build (v2)
      working-directory: v2
      run: go build -v ./...

    - name: Test (v2)
      working-directory: v2
      run: go test -v ./...

    - name: Test (v2, race)
      if: runner.os == 'Linux' && matrix.go-version == '1.27'
      working-directory: v2
      run: go test -race -v ./...

    - name: Test (v2, json/v2 backend)
      if: runner.os == 'Linux'
      working-directory: v2
      env:
        GOEXPERIMENT: jsonv2
      run: go test -v ./...
