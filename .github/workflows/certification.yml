name: Certification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    name: Go/Python interop
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "stable"
        check-latest: true
        cache-dependency-path: |
          certification/go.sum
          v2/go.sum

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.x"
        check-latest: true

    - name: Install reference Python implementation
      run: python3 -m pip install --disable-pip-version-check varlink==31.0.0

    - name: Run Go/Python cross-implementation tests
      run: sh certification/run-interop.sh

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: certification-results
        path: /tmp/varlink-certification
        if-no-files-found: ignore
